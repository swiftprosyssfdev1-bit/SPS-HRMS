{% load static %}
<link rel="stylesheet" href="{% static 'css/chatbot.css' %}?v=2">

<div id="hr-chatbot-root">
  <button id="hr-chatbot-toggle" type="button" aria-label="Open Your Assist">
    💬
  </button>

  <div id="hr-chatbot-panel" class="hr-chatbot-hidden">
    <div id="hr-chatbot-header">
      <span>🤖 Your Assist</span>
      <button id="hr-chatbot-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="hr-chatbot-messages">
      <div class="hr-chatbot-msg hr-chatbot-msg-bot">
        Hi {{ request.user.first_name|default:request.user.username }}! I'm Your Assist. Ask me about your leave balance, attendance, payslip or general HR questions.
      </div>
    </div>
    <form id="hr-chatbot-form">
      {% csrf_token %}
      <input type="text" id="hr-chatbot-input" placeholder="Type your question..." autocomplete="off">
      <button type="submit" id="hr-chatbot-send">Send</button>
    </form>
  </div>
</div>

<script src="{% static 'js/chatbot.js' %}?v=3"></script>
