{% extends 'core/base.html' %}
{% block title %}Appraisal Calculator{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">
    <h5>APPRAISAL CALCULATOR</h5>
  </div>
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="form-group mb-3">
        <label>Employee</label>
        <select name="employee" class="form-control" required>
          <option value="">Select Employee</option>
          {% for emp in employees %}
          <option value="{{ emp.id }}">{{ emp.get_full_name|default:emp.username }} ({{ emp.employee_id }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group mb-3">
        <label>Start Month & Year</label>
        <input type="month" name="start_month" class="form-control" required>
        <small class="text-muted">The appraisal period will automatically cover 12 months starting from this month.</small>
      </div>
      <button type="submit" class="btn btn-primary">Generate Appraisal</button>
    </form>
  </div>
</div>
{% endblock %}
